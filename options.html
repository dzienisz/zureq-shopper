<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zureq Shopper Options</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main class="settings">
    <p class="eyebrow">ZUREQ SHOPPER</p>
    <h1>Options</h1>
    <p class="intro">Your key is stored in Chrome sync storage and is only sent to api.zureq.io.</p>
    <form id="settings-form">
      <label>API key
        <div class="key-row"><input id="api-key" type="password" autocomplete="off" spellcheck="false" placeholder="Paste your Zureq key"><button type="button" id="toggle-key" class="secondary">Show</button></div>
      </label>
      <button type="button" id="test-key" class="secondary">Test connection</button>
      <label>Default country<select id="default-country"><option value="">Any country</option><option value="EU">EU</option></select></label>
      <label>Default currency<input id="default-currency" maxlength="3" value="PLN"></label>
      <button class="primary" type="submit">Save options</button>
    </form>
    <p id="status" role="status"></p>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
