name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run tests
        run: npm test

      - name: Build Firefox extension
        run: npm run build:firefox

      # Expected warnings: guarded sidePanel calls and HTML sinks (templates use esc; decodeEntities uses a textarea).
      - name: Lint Firefox extension
        run: npx --yes web-ext@10 lint --source-dir dist/firefox

      - name: Check JavaScript syntax
        run: |
          for file in *.js test/*.js; do
            node --check "$file"
          done

      - name: Package extension
        run: bash scripts/package.sh
